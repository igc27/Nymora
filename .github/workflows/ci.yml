name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run build:native
      - run: npm run lint
      - run: npm test
      - run: npm run notices
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Generate original legal QA media
        run: |
          choco install ffmpeg --no-progress -y
          npm run test:media
      - run: npm run test:e2e
      - run: node tests/addons.e2e.cjs
      - run: npm run test:p2p
      # Release freeze: QA output remains local to the runner. No uploads.
