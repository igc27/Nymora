name: Windows release build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run notices
      - run: npm audit --omit=dev
      - run: choco install ffmpeg --no-progress -y
      - run: npm run test:media
      - run: npm run package
      - name: Test packaged application
        shell: pwsh
        run: |
          $env:NYMORA_TEST_EXE = (Resolve-Path release/win-unpacked/Nymora.exe).Path
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Packaged HTTP/HLS checks failed' }
          npm run test:p2p
          if ($LASTEXITCODE -ne 0) { throw 'Packaged P2P checks failed' }
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object { "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content -Path release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nymora-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Attach verified assets to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} --json id 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingAssets = @(gh release view ${{ github.ref_name }} --json assets --jq '.assets[].name')
            $buildAssets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip' })
            foreach ($asset in $buildAssets) {
              if ($asset.Name -notin $existingAssets) {
                gh release upload ${{ github.ref_name }} $asset.FullName
                if ($LASTEXITCODE -ne 0) { throw "Could not attach verified asset $($asset.Name)" }
              }
            }
            if ('SHA256SUMS.txt' -notin $existingAssets) {
              $published = gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} | ConvertFrom-Json
              $checksumLines = foreach ($asset in $published.assets | Where-Object { $_.name -match '\.(exe|zip)$' }) {
                if ($asset.digest -notmatch '^sha256:[a-f0-9]{64}$') { throw "Missing SHA-256 digest for $($asset.name)" }
                "$($asset.digest.Substring(7))  $($asset.name)"
              }
              $checksumLines | Set-Content -LiteralPath release/SHA256SUMS.txt
              gh release upload ${{ github.ref_name }} release/SHA256SUMS.txt
              if ($LASTEXITCODE -ne 0) { throw 'Could not attach release checksums' }
            }
            Write-Output 'Missing verified assets attached. Existing release assets remain intact.'
          } else {
            gh release create ${{ github.ref_name }} release/*.exe release/*.zip release/SHA256SUMS.txt --draft --title "Nymora ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md
          }
