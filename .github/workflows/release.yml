# Release freeze: local development only until the owner explicitly sends
# PUBLISH NYMORA after manual testing. No tag trigger, publishing job or upload.
name: Release freeze
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen:
    runs-on: windows-latest
    steps:
      - name: Explain local development workflow
        run: Write-Output 'Publishing is frozen. Build and test locally; wait for PUBLISH NYMORA after manual testing.'
